name: Accessibility

on:
  pull_request:
    paths:
      - '.github/workflows/accessibility.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessibility.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          runtime: node@lts

      - name: Locate Chromium
        run: |
          chromium_path="$(command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chromium_path" ]; then
            echo "Chromium is not installed on the runner" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$chromium_path" >> "$GITHUB_ENV"

      - name: Run accessibility tests
        run: pnpm test:accessibility:ci
